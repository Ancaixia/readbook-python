{% extends "base.html" %}
{% block title %}注册 · ReadBook 后台{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>注册账号</h1>
    {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
    <form method="post" action="/auth/register">
      <label>用户名
        <input type="text" name="username" value="{{ username or '' }}" autocomplete="username" required>
      </label>
      <label>密码
        <input type="password" name="password" autocomplete="new-password" required>
        <small class="muted">至少 6 位</small>
      </label>
      <label>确认密码
        <input type="password" name="password2" autocomplete="new-password" required>
      </label>
      <button type="submit" class="btn btn-block">注册并登录</button>
    </form>
    <p class="auth-foot">已有账号？<a href="/auth/login">去登录</a></p>
  </div>
</div>
{% endblock %}
