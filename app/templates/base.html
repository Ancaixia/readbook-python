<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name | default('ReadBook') }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <a href="/">{{ app_name | default('ReadBook') }}</a>
    <nav class="nav">
      {% if request.state.user_role == 'admin' %}
        <a class="nav-admin" href="/admin/users">用户</a>
      {% endif %}
      <a class="nav-admin" href="/admin">后台</a>
      {% if request.state.user_id %}
        <a href="/auth/logout">退出</a>
      {% else %}
        <a href="/auth/login">登录</a>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">数据阅读系统 · FastAPI + Vue/Flutter</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
